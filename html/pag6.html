<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>UniRide</title>

  <style>
    /* Página toda branca, com letras pretas */
    body {
      font-family: Arial;
      background-color: white;
      color: black;
    }

    /* Caixa no meio da tela */
    .caixa {
      width: 300px;
      margin: 80px auto;
    }

    /* Campos de e-mail e senha */
    input {
      width: 100%;
      padding: 8px;
      margin-bottom: 15px;
      box-sizing: border-box;
    }

    /* Botão azul claro com letra preta */
    button {
      width: 100%;
      padding: 10px;
      background-color: #93c5fd;
      color: black;
      border: none;
    }
  </style>
</head>

<body>

  <div class="caixa">
    <h2>UniRide</h2>
    <h1>Sua carona começa aqui</h1>
    <p>Entre na sua conta para ver as rotas disponíveis e conectar com outros estudantes da sua faculdade.</p>

    <h2>Bem-vindo de volta</h2>
    <p>Entre com seus dados de acesso</p>

    <p>E-mail</p>
    <input type="email" placeholder="seu@email.com">

    <p>Senha</p>
    <input type="password" placeholder="Sua senha">

    <button>Entrar</button>

    <p>Não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
  </div>

</body>
</html>
